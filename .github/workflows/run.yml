name: Pure Free Manga

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v3
      
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        
    - name: Install Dependencies
      run: pip install -r requirements.txt

    - name: Run Script
      # 不需要任何 env 和 secret
      run: python main.py
      
    - name: Upload Result
      uses: actions/upload-artifact@v4
      with:
        name: manga-output
        path: output/
