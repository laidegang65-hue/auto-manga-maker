name: Video Manga Generator

on:
  workflow_dispatch:
    inputs:
      novel_text:
        description: '输入小说文案'
        required: true
        default: '林萧站在废墟顶端，红色的斗篷在风中猎猎作响。他拔出背后的长刀，刀锋在月光下闪着寒光。前方，一只巨大的机械巨兽正缓缓从阴影中浮现。'

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v3
      
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        
    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg

    - name: Install Python Libs
      run: pip install -r requirements.txt

    - name: Run Script
      env:
        USER_NOVEL: ${{ inputs.novel_text }}
      run: python main.py
      
    - name: Upload Video
      uses: actions/upload-artifact@v4
      with:
        name: final-video
        path: output/final_video.mp4
